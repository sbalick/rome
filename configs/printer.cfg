#---------------------------------------------------- X -----------------------------------------------------
# The A motor in the CoreXY system, located at the rear left of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_x]
dir_pin: x_dir_pin                 # Add ! in front of pin name to reverse the direction of stepper_x
rotation_distance: 40              # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: 0
position_max: 300
position_endstop: 0

#---------------------------------------------------- Y -----------------------------------------------------
# The B motor in the CoreXY system, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_y]
dir_pin: y_dir_pin                 # Add ! in front of pin name to reverse the direction of stepper_y
rotation_distance: 40              # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: 0
position_max: 300
position_endstop: 300

#---------------------------------------------------- Z -----------------------------------------------------
# The left Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z]
dir_pin: !z0_dir_pin               # Remove ! in front of pin name to reverse the direction of stepper_z
rotation_distance: 4               # 4 for TR8*4 lead screws
homing_speed: 10
position_min: -5
position_max: 300

[tmc2209 stepper_z]
run_current: 1.6
#run_current: 1.75

#---------------------------------------------------- Z1 ----------------------------------------------------
# The rear Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z1]
dir_pin: !z1_dir_pin               # Remove ! in front of pin name to reverse the direction of stepper_z1
rotation_distance: 4               # 4 for TR8*4 lead screws

[tmc2209 stepper_z1]
run_current: 1.6
#run_current: 1.75

#---------------------------------------------------- Z2 ----------------------------------------------------
# The right Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z2]
dir_pin: !z2_dir_pin               # Remove ! in front of pin name to reverse the direction of stepper_z2
rotation_distance: 4               # 4 for TR8*4 lead screws

[tmc2209 stepper_z2]
run_current: 1.6
#run_current: 1.75

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the toolhead
#
# rotation_distance = full_steps_per_rotation * microsteps / steps_per_millimeter
#    Or
#    200 * 16 / 690 = 4.63768116
#------------------------------------------------------------------------------------------------------------
[extruder]
##########   BONDTECH LGX Lite Values
##########dir_pin: toolboard_t0:e_dir_pin   # Remove ! in front of pin name to reverse the direction of extruder
##########rotation_distance: 5.62176967624438           # Bondtech LGX Lite default --- Updated SB

##########   LDO ORBITER 2.x Values
dir_pin: toolboard_t0:e_dir_pin
#rotation_distance: 4.61210228      # 200 * 16 / 690 = 4.63768116 * Extruder_cal
rotation_distance: 4.63768116      # 200 * 16 / 690 = 4.63768116 * Extruder_cal
pressure_advance: 0.047            # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
#control: pid
#pid_kp: 28.413
#pid_ki: 1.334
#pid_kd: 151.300

#"flowType": "uhf"

sensor_type: PT1000
heater_pin: toolboard_t0:PB13 
sensor_type: MAX31865
sensor_pin: toolboard_t0:PA4
spi_bus: spi1
max_temp: 325



[heater_bed]
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114

##########################
##   EXLCUDE OBJECT
##########################
[exclude_object]



#########################
##   FANS
#########################

[fan]
## Cooling Fan - Raspberry Pi GPIO 26
# Suggestion to try FAN1 at J51 on PE5 so that HW PWM can be used.  Suspect slow GPIO on RPI
# RPI does not have good low speed control. Tested PWM period at 25ms, still no change in
# behavior. 20% is min control speed so far. Would like to use HW PWM to see if 10% is possible
# especially for ASA/ABS low cooling.
pin: rpi:gpio26
max_power: 1
cycle_time: 0.025
hardware_pwm: false
shutdown_speed: 0
kick_start_time: 0.2
#off_below: 0.18

[heater_fan toolhead_cooling_fan]
pin: toolboard_t0:fan_toolhead_cooling_pin
heater: extruder
max_power: 1.0
fan_speed: 1.0



##############################
#
#  Code excerpt taken from
#  https://klipper.discourse.group/t/how-to-get-the-controller-fan-to-turn-on-at-power-up/7313/11
#
##############################
[fan_generic electronics]
#   Octopus PA8 connection
#   This is Fan0 on J50 at PA8
pin: !PA8
max_power: 1.0
cycle_time: 0.002
hardware_pwm: false
kick_start_time: 0.5
off_below: 0.2
shutdown_speed: 1.0

[delayed_gcode start_fan_at_idle_speed]
initial_duration: 1.
gcode:
  SET_FAN_SPEED FAN=electronics SPEED=1.0

#########################
##   CHAMBER LEDS
#########################
[neopixel Enclosure_Lights]
pin: PB0
#   Actual chain count is 140
#   There is a hard coded limit of 125 RGBW and 165 RGB LEDs in Klipper for stability
chain_count: 139
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0.25
initial_GREEN: 0.25
initial_BLUE: 0.25


#########################
##   BEACON BED PROBE
#########################
[bed_mesh]
speed: 500
probe_count: 21, 21

[safe_z_home]
home_xy_position: 150, 150  # update for your machine
z_hop: 3


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_82354A545154364134202020FF141941-if00   # Original device
#serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_52E011BC5154354D38202020FF0A2D1E-if00    # replacement
x_offset: 0 # update with offset from nozzle on your machine
y_offset: -16.3 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_sensitivity: 0    # value is 0 (default) to 3  - don't do 3


#home_z_hop_speed: 30
#home_xy_move_speed: 300
#default_probe_method: contact
#home_method: contact # use proximity for induction homing
#home_method_when_homed: proximity # after initial calibration use induction
#home_autocalibrate: unhomed # contact will calibrate beacon on first home


[gcode_macro RatOS]
variable_beacon_bed_mesh_scv: 18                        # square corner velocity for bed meshing with proximity method
variable_beacon_contact_z_homing: False                 # Make all G28 calls use contact instead of proximity scan
variable_beacon_contact_start_print_true_zero: True     # Use contact to determine true Z=0 for the last homing move during START_PRINT
variable_beacon_contact_wipe_before_true_zero: True     # enables a nozzle wipe at Y10 before true zeroing
variable_beacon_contact_true_zero_temp: 220             # nozzle temperature for true zeroing
                                                        # WARNING: if you're using a smooth PEI sheet, be careful with the temperature

variable_beacon_contact_prime_probing: False             # probe for priming with contact method
variable_beacon_contact_expansion_compensation: True    # enables the nozzle thermal expansion compensation

variable_beacon_contact_bed_mesh: False                 # bed mesh with contact method
variable_beacon_contact_bed_mesh_samples: 2             # probe samples for contact bed mesh

variable_beacon_contact_z_tilt_adjust: False            # z-tilt adjust with contact method
variable_beacon_contact_z_tilt_adjust_samples: 2        # probe samples for contact z-tilt adjust

variable_beacon_scan_compensation_enable: False         # Enables the beacon scan compensation
variable_beacon_scan_compensation_profile: "Contact"    # The contact profile name for the scan compensation
variable_beacon_scan_compensation_probe_count: 21,21    # The contact probe count for the scan compensation

variable_beacon_contact_poke_bottom_limit: -1		    # The bottom limit for the contact poke test

[stepper_z]
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop


#########################
##   CHAMBER
