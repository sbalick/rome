######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

#[gcode_macro M600]
#gcode:
#    {% set X = params.X|default(50)|float %}
#    {% set Y = params.Y|default(0)|float %}
#    {% set Z = params.Z|default(10)|float %}
#    SAVE_GCODE_STATE NAME=M600_state
#    PAUSE
#    G91
#    G1 E-.8 F2700
#    G1 Z{Z}
#    G90
#    G1 X{X} Y{Y} F3000
#    G91
#    G1 E-50 F1000
#    RESTORE_GCODE_STATE NAME=M600_state


###################################################################
#
# The following section is taken from the following github page
#
#    https://github.com/SoftFever/OrcaSlicer/issues/7722
#
###################################################################

[gcode_macro FILAMENT_CHANGE] # M600
gcode:
    {% set MM_TO_PURGE = params.MM_TO_PURGE|default(30)|int %}
    {% set FILAMENT_NAME = params.FILAMENT_NAME|default('The name of the filament has been not passed')|string %}
  
    RESPOND TYPE=echo MSG='FILAMENT CHANGE (M600) command. Purge {MM_TO_PURGE} mm'

    PAUSE
    #SET_GCODE_VARIABLE MACRO=global_vars VARIABLE=caller VALUE='"M600"'
    SET_GCODE_VARIABLE MACRO=global_vars VARIABLE=m600_purge_mm VALUE={MM_TO_PURGE}
  
    UNLOAD_FILAMENT
  
    _CHANGE_FILAMENT_DIALOG FILAMENT_NAME='{FILAMENT_NAME}'
  

[gcode_macro _CHANGE_FILAMENT_DIALOG]
gcode:
  {% set m600_purge_mm = printer["gcode_macro global_vars"].m600_purge_mm %} 
  {% set FILAMENT_NAME = params.FILAMENT_NAME|default('The name of the filament has been not passed')|string %}
  RESPOND TYPE=echo MSG='{FILAMENT_NAME}'
  
  RESPOND TYPE=command MSG="action:prompt_begin M600 color changing"
  RESPOND TYPE=command MSG="action:prompt_text Insert the new FILAMENT and press LOAD then CONTINUE"
  RESPOND TYPE=command MSG="action:prompt_text {FILAMENT_NAME}"
  RESPOND TYPE=command MSG="action:prompt_button LOAD FILAMENT|LOAD_FILAMENT MM_TO_PURGE={m600_purge_mm}|primary"
  RESPOND TYPE=command MSG="action:prompt_button CLOSE THIS DIALOG|RESPOND TYPE=command MSG=action:prompt_end|warning"
  RESPOND TYPE=command MSG="action:prompt_button CONTINUE PRINT|_resume_and_close_dialog|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _resume_and_close_dialog]
gcode:
    RESPOND type="command" msg="action:prompt_end"
    RESUME
  
 

[gcode_macro global_vars]
variable_caller: ""
variable_m600_purge_mm: 25
#variable_last_fan_speed: 0.1

gcode:
  RESPOND TYPE=echo MSG='variables:'
  RESPOND TYPE=echo MSG='m600_purge_mm = {printer["gcode_macro global_vars"].m600_purge_mm}'
  RESPOND TYPE=echo MSG='caller = {printer["gcode_macro global_vars"].caller}'
 # RESPOND TYPE=echo MSG='last_fan_speed = {printer["gcode_macro global_vars"].last_fan_speed}'

